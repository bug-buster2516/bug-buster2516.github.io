<style>
:root{--bg:#000;--fg:#d4d4d4;--g:#3ddc57;--c:#22d3ee;--b:#58a6ff;--dim:#8a8a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg)}
body{font:13px/1.55 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--fg);overflow-x:hidden}
.win{height:100%;margin:0;border:1px solid var(--g);display:grid;grid-template-rows:auto 1fr auto;min-height:0}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--g)}
h1{margin:0;font-size:20px;font-weight:700;color:var(--g);line-height:1.2}
.sub{font-size:11px;color:var(--fg)}
nav{font-size:12px;color:var(--g);text-align:right;max-width:62%}
nav button{font:inherit;color:var(--g);background:none;border:0;padding:2px 4px;cursor:pointer}
nav button:hover{text-decoration:underline}
nav span{color:var(--dim)}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
main{display:grid;grid-template-columns:40% 60%;min-height:0}
.stage{position:relative;overflow:hidden;border-right:1px solid var(--g);perspective:900px;touch-action:none;min-height:0}
.swing{position:absolute;left:50%;top:0;width:0;transform-origin:50% 0;cursor:grab}
.swing.drag{cursor:grabbing}
.lanyard{position:absolute;left:-6px;top:0;width:12px;height:var(--ll,90px);background:var(--g);opacity:.85}
.badge{position:absolute;left:calc(var(--bw,210px)/-2);top:calc(var(--ll,90px) - 6px);width:var(--bw,210px);border:1px solid var(--g);background:#000;padding:14px;text-align:center;transform-style:preserve-3d}
.clip{width:34px;height:8px;border:1px solid var(--g);margin:0 auto 10px}
.badge img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--g);background:#0a0a0a;-webkit-user-drag:none;user-select:none}
.badge b{display:block;margin-top:10px;color:var(--g);font-size:14px}
.badge small{display:block;color:var(--fg);font-size:11px}
.cap{position:absolute;right:8px;bottom:6px;font-size:10px;color:var(--dim)}
.term{display:flex;flex-direction:column;min-height:0;padding:10px 16px}
#out{flex:1;overflow-y:auto;min-height:0;overflow-wrap:anywhere}
#out .blk{margin:0 0 12px}
.p{color:var(--fg)}.u{color:var(--c)}.cmd{color:var(--g)}
.g{color:var(--g)}.d{color:var(--dim)}
a{color:var(--b);text-decoration:underline}
.row{display:flex;gap:8px;align-items:center}
#in{flex:1;min-width:0;font:inherit;color:var(--g);background:none;border:0;padding:2px 0;caret-color:var(--g)}
#in:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.out-btn{font:inherit;color:var(--g);background:none;border:1px solid var(--g);padding:0 6px;cursor:pointer;margin-left:6px}
ul.l{margin:2px 0;padding-left:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer{display:flex;justify-content:space-between;gap:8px;padding:4px 16px;border-top:1px solid var(--g);font-size:10px;color:var(--dim)}
@media(max-width:800px){
 html,body{height:auto}
 .win{height:auto;min-height:100vh}
 header{flex-direction:column}
 nav{text-align:left;max-width:100%}
 nav button{padding:8px 6px}
 main{grid-template-columns:1fr;grid-template-rows:400px minmax(60vh,auto)}
 .stage{border-right:0;border-bottom:1px solid var(--g)}
 .term{min-height:60vh}
 #out{max-height:none}
 footer{flex-direction:column}
}
</style>
</head>

  proj(1,"Car Damage Detection for Insurance","Deep learning system that detects and classifies vehicle damage for insurance claims. 83% accuracy. Published at IEEE INDIACom 2025.","ResNet-50, EfficientNet-B0, transfer learning, data augmentation, Python")+
  proj(2,"YouTube Video Summarizer","NLP tool that extracts a video’s transcript and generates a concise summary.","transformers, text preprocessing, Python")+
  proj(3,"Geolocation Data Analysis","Exploratory analysis with cleaning, statistics and geospatial visualization.","Python, Pandas, Matplotlib")+'</ol>'},
 skills:function(){var g=[["Data and databases","SQL (DB2, MySQL), ETL and data pipelines, data modeling, data warehousing, data validation, reconciliation"],["AI and ML","RAG, MCP, LLM-based tools, NLP, Scikit-Learn, TensorFlow/Keras, PyTorch, statistics"],["Languages and frameworks","Python, SQL, COBOL400, CL400, Pandas, NumPy, Matplotlib, Flask, Streamlit"],["Platforms and tools","IBM i (AS400), SMART400, AWS, Git, Jupyter, Google Colab, VS Code, MS Excel"]];
  return g.map(function(x){return '<span class="g">'+x[0]+'</span><br>&nbsp;&nbsp;'+x[1]}).join("<br><br>")},

var NAMES=["help","about","experience","projects","skills","education","certifications","contact","sudo","clear"];
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function print(html,cls){var d=document.createElement("div");d.className="blk";d.innerHTML=html;out.appendChild(d);out.scrollTop=out.scrollHeight;return d}
function run(raw,fromAuto){
 var line=raw.trim(),cmd=line.split(/\s+/)[0].toLowerCase();
 if(!fromAuto&&line){hist.push(line);hi=hist.length}
 if(cmd==="clear"){out.innerHTML="";return}
 print('<span class="u">aaquil</span><span class="p">@portfolio:~$</span> <span class="cmd">'+esc(line)+'</span>');
 if(!cmd)return;
 if(C[cmd])print(C[cmd]());
 else print('command not found: '+esc(cmd)+'. Type <span class="g">help</span> to see available commands.');
}
$("f").addEventListener("submit",function(e){e.preventDefault();var v=inp.value;inp.value="";run(v)});

 if(e.key==="ArrowUp"){e.preventDefault();if(hi>0){hi--;inp.value=hist[hi]}}
 else if(e.key==="ArrowDown"){e.preventDefault();if(hi<hist.length-1){hi++;inp.value=hist[hi]}else{hi=hist.length;inp.value=""}}
 else if(e.key==="Tab"){e.preventDefault();var v=inp.value.trim().toLowerCase();if(!v)return;
  var m=NAMES.filter(function(n){return n.indexOf(v)===0});
  if(m.length===1)inp.value=m[0];
  else if(m.length>1)print('<span class="d">'+m.join("&nbsp;&nbsp;")+'</span>')}
 else if(e.key==="l"&&e.ctrlKey){e.preventDefault();out.innerHTML=""}
});

tick();setInterval(tick,1000);
run("welcome",true);
/* Badge physics: damped pendulum, drag to swing */
var sw=$("swing"),bd=$("badge"),st=$("stage"),ph=$("photo");
var still=matchMedia("(prefers-reduced-motion: reduce)").matches;
var th=0,w=0,drag=false,last=0;
function size(){var h=st.clientHeight,sw2=st.clientWidth;var bw=Math.max(170,Math.min(280,sw2*0.7,h*0.52));sw.style.setProperty("--bw",bw+"px");var bh=bd.offsetHeight;sw.style.setProperty("--ll",Math.max(30,(h-bh)/2)+"px")}
size();addEventListener("resize",size);addEventListener("load",size);
function draw(){sw.style.transform="rotate("+th+"rad)";bd.style.transform="rotateY("+Math.max(-40,Math.min(40,w*9))+"deg)"}
function frame(t){var dt=Math.min(0.03,(t-last)/1000||0.016);last=t;
 if(!drag){w+=(-26*Math.sin(th)-0.7*w)*dt;th+=w*dt;if(Math.abs(th)<0.0005&&Math.abs(w)<0.0005){th=0;w=0}}
 draw();requestAnimationFrame(frame)}
if(!still){
 sw.addEventListener("pointerdown",function(e){drag=true;sw.classList.add("drag");sw.setPointerCapture(e.pointerId);e.preventDefault()});
 sw.addEventListener("pointermove",function(e){if(!drag)return;var r=st.getBoundingClientRect(),px=r.left+r.width/2,dx=e.clientX-px,dy=Math.max(20,e.clientY-r.top);
  var n=Math.max(-1.2,Math.min(1.2,Math.atan2(-dx,dy)));w=(n-th)*30;th=n});
 var up=function(){drag=false;sw.classList.remove("drag")};
 sw.addEventListener("pointerup",up);sw.addEventListener("pointercancel",up);
 setTimeout(function(){w=2.2},700);
 requestAnimationFrame(frame);
}else{sw.style.cursor="default"}
ph.addEventListener("error",function(){ph.style.display="none"});
})();
